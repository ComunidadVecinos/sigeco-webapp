services:
  db:
    image: postgres:15-alpine
    container_name: app_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: app_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/appdb?schema=public
      PORT: 4000
      JWT_SECRET: supersecret_jwt_key_change_me
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network


  frontend:
    build: ./frontend
    container_name: app_frontend
    depends_on:
      - backend
    networks:
      - app_network

  nginx:
    build: ./nginx
    container_name: app_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data:
