services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - sigeco_network
    restart: unless-stopped

  db_init:
    build: ./backend
    container_name: app_db_init
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:deploy && npm run db:seed"]
    networks:
      - sigeco_network
    restart: "no"

  backend:
    build: ./backend
    container_name: app_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${BACKEND_PORT}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      SESSION_SAMESITE: ${SESSION_SAMESITE}
      SESSION_SECURE: ${SESSION_SECURE}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sigeco.local}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
    depends_on:
      db_init:
        condition: service_completed_successfully
    networks:
      - sigeco_network
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: app_mailpit
    ports:
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - sigeco_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: app_frontend
    depends_on:
      - backend
    networks:
      - sigeco_network
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: app_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - sigeco_network
    restart: unless-stopped

networks:
  sigeco_network:

volumes:
  db_data:
  backend_node_modules:
